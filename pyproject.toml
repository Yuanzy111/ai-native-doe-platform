[project]
name = "ai-native-doe-platform-backend"
version = "0.2.0"
description = "Backend domain models, validation, persistence, and application service for the AI-native DoE platform."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.13.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
agent = [
    "openai>=2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
